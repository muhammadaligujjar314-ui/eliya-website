{% extends "base.html" %}
{% block title %}Custom Goal — Eliya Goals{% endblock %}
{% block content %}

<header class="page-header goals-header">
  <a href="/goals" class="back-link">← Back to Goals</a>
  <h1>Custom Goal</h1>
</header>

<section class="goal-form-section">
  <input type="text" id="goalName" placeholder="What's your goal? e.g. Learn Python in 30 days" class="goal-input">
  <button onclick="startGoal()" class="cta-btn">Start Tracking</button>

  <div id="goalTracker" style="display:none; margin-top:30px;">
    <h2 id="goalTitle"></h2>
    <div id="goalGauge" class="gauge-wrap"></div>
    <p class="streak-text">Streak: <span id="streakCount">0</span> days</p>
    <div id="dayGrid" class="day-grid"></div>
  </div>
</section>

<script src="{{ url_for('static', filename='js/goals.js') }}"></script>
<script>
  const STORAGE_KEY = "eliya_custom_goal";
  let goalData = loadGoalData(STORAGE_KEY, null);

  function startGoal() {
    const name = document.getElementById("goalName").value.trim();
    if (!name) return alert("Goal likhein pehle");
    goalData = { name: name, checked: [] };
    saveGoalData(STORAGE_KEY, goalData);
    render();
  }

  function toggleDay(day) {
    const idx = goalData.checked.indexOf(day);
    if (idx > -1) goalData.checked.splice(idx, 1);
    else goalData.checked.push(day);
    saveGoalData(STORAGE_KEY, goalData);
    render();
  }

  function render() {
    if (!goalData) return;
    document.getElementById("goalTracker").style.display = "block";
    document.getElementById("goalTitle").textContent = goalData.name;
    document.getElementById("streakCount").textContent = goalData.checked.length;
    renderGrid("dayGrid", 30, goalData.checked, toggleDay);
    renderGauge("goalGauge", (goalData.checked.length / 30) * 100);
  }

  if (goalData) render();
</script>

{% endblock %}
